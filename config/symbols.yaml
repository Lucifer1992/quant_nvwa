symbols:
  ETHUSDT:
    enabled: true
    # base_interval 决定 backfill/check-data 实际回填与校验的最低周期，
    # 也是回测引擎的结算节奏（当前所有策略都在 5m 触发、1h 决策）。
    base_interval: 5m
    intervals: [5m, 1h, 4h]
    since: "2024-01-01"
    contract: usdm_perp
    leverage_default: 10
    # paper 服务的订阅列表（回测用 --strategy 指定，不读这里）。
    # rule_v4 是实测最好的规则策略；lgbm_v1 样本外为负收益，留在这里是为了持续观察
    # paper 表现是否与回测一致，见 config/strategies/lgbm_v1.yaml 的结论段。
    strategies: [rule_v4, lgbm_v1]
  # 新增品种照此复制即可（SOLUSDT ...）
  BTCUSDT:
    enabled: false
    base_interval: 5m
    intervals: [5m, 1h, 4h]
    since: "2024-01-01"
    contract: usdm_perp
    leverage_default: 10
    strategies: [rule_v1]
