[project]
name = "quant-llm"
version = "0.1.0"
description = "Personal quant platform: Binance USDT-M perp data, rule strategy, backtest, risk, Feishu signal cards"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6",
    "python-dotenv>=1",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
]

[project.scripts]
quant = "quant.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
